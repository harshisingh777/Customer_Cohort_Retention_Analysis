name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PII_KEY: ci0123456789abcdef0123456789abcd
      API_JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long-xx
      EXPORT_SIGNING_KEY: ci-export-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      - name: sqlfluff
        run: uv run sqlfluff lint pipeline/dbt/models pipeline/dbt/tests
      - name: OpenAPI schema drift
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code apps/api/openapi.json
      - name: pytest (dbt build + unit tests + invariants, real-data cross-check, API, publish safety)
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Generated client drift
        run: |
          pnpm gen
          git diff --exit-code src/lib/api/schema.d.ts
      - name: Unit tests (formatters, scales, ramp contrast)
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          cp .env.example .env
          for key in POSTGRES_PASSWORD MIGRATOR_PASSWORD PIPELINE_PASSWORD API_RO_PASSWORD API_OPS_PASSWORD WEB_AUTH_PASSWORD PII_KEY API_JWT_SECRET EXPORT_SIGNING_KEY AUTH_SECRET; do
            old=$(grep "^${key}=" .env | cut -d= -f2-)
            sed -i "s|${old}|$(openssl rand -hex 24)|g" .env
          done
      - name: Start the stack
        run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - name: Seed Online Retail II
        run: docker compose -f infra/docker-compose.yml run --rm worker python -m pipeline.ingest seed retail --skip-clv
      - name: Invite test users
        run: |
          docker compose -f infra/docker-compose.yml exec -T db sh -c \
            "psql -U postgres -d retention -c \"insert into ops.users (email, role) values ('admin@example.com','admin'), ('viewer@example.com','viewer') on conflict do nothing\""
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Playwright (smoke + axe + 375 px)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
      - uses: astral-sh/setup-uv@v6
      - name: Schemathesis (property-based fuzzing of every GET route)
        run: |
          set -a; . ./.env; set +a
          TOKEN=$(uvx --with pyjwt python -c "import jwt,os,time; print(jwt.encode({'sub':'viewer@example.com','role':'viewer','exp':int(time.time())+3600}, os.environ['API_JWT_SECRET'], algorithm='HS256'))")
          uvx schemathesis run http://localhost:8000/openapi.json \
            --header "Authorization: Bearer ${TOKEN}" --include-method GET \
            --checks not_a_server_error --max-examples 25
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 200

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
