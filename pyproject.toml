[project]
name = "retention"
version = "1.0.0"
description = "Cohort and retention analytics platform: ingest, dbt marts, API and worker."
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary,pool]>=3.2",
  "pyyaml>=6.0",
]

[dependency-groups]
api = [
  "fastapi>=0.142.4",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.32.0",
  "pyjwt>=2.10",
  "brotli-asgi>=1.4",
  "email-validator>=2.2",
  "sentry-sdk[fastapi]>=2.20",
  "boto3>=1.43.109",
]
pipeline = [
  "dbt-core>=1.9,<2",
  "dbt-postgres>=1.9,<2",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "pymc-marketing>=0.10",
  "playwright>=1.48",
  "boto3>=1.43.109",
  "alembic>=1.14",
  "sqlalchemy>=2.1.4",
  "pyjwt>=2.10",
  "sentry-sdk>=2.20",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.168.5",
  "schemathesis>=4.29.4",
  "testcontainers[postgres]>=4.8",
  "httpx>=0.27",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "sqlfluff>=3.2",
  "sqlfluff-templater-dbt>=3.2",
]

[tool.uv]
package = false
default-groups = ["api", "pipeline", "dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
  "db: needs a running Postgres (TEST_DATABASE_URL or testcontainers)",
  "slow: runs dbt or fits a model",
  "retail: needs the Online Retail II dataset in data/",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "pipeline/dbt/target", "pipeline/dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# UP046: pydantic generic models keep typing.Generic so OpenAPI names stay stable.
ignore = ["S101", "S608", "E501", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# Synthetic data: deterministic pseudo-randomness is the point.
"pipeline/synth/**" = ["S311"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["core", "apps/api", "pipeline"]
exclude = ["pipeline/dbt", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
