version: 2

models:
  - name: int_orders
    columns:
      - name: customer_key
        tests: [not_null]
      - name: net_revenue
        tests: [not_null]

  - name: int_customer_acquisition
    description: One row per customer, attributes frozen at the first qualifying order.
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: cohort_month
        tests: [not_null]

  - name: int_customer_activity_monthly
  - name: int_customer_activity_weekly
  - name: int_lapse_threshold
    columns:
      - name: threshold_days
        tests: [not_null]
