# API and worker as always-on instances (spec §14). The web app deploys to Vercel from apps/web.
# Secrets are set in the dashboard (sync: false); nothing environment-specific is committed.
services:
  - type: web
    name: retention-api
    runtime: docker
    dockerfilePath: infra/docker/api.Dockerfile
    dockerContext: .
    plan: starter            # always on; free instances sleep
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - { key: APP_ENV, value: production }
      - { key: API_DATABASE_URL, sync: false }
      - { key: API_OPS_DATABASE_URL, sync: false }
      - { key: API_JWT_SECRET, sync: false }
      - { key: EXPORT_SIGNING_KEY, sync: false }
      - { key: CORS_ALLOWED_ORIGINS, sync: false }
      - { key: SENTRY_DSN, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ENDPOINT_URL, sync: false }
      - { key: S3_REGION, sync: false }
      - { key: AWS_ACCESS_KEY_ID, sync: false }
      - { key: AWS_SECRET_ACCESS_KEY, sync: false }

  - type: worker
    name: retention-worker
    runtime: docker
    dockerfilePath: infra/docker/worker.Dockerfile
    dockerContext: .
    dockerCommand: python -m pipeline.worker
    preDeployCommand: alembic -c infra/migrations/alembic.ini upgrade head
    plan: standard           # PyMC fits want the memory
    autoDeploy: true
    envVars:
      - { key: APP_ENV, value: production }
      - { key: PIPELINE_DATABASE_URL, sync: false }
      - { key: MIGRATOR_DATABASE_URL, sync: false }
      - { key: PII_KEY, sync: false }
      - { key: API_JWT_SECRET, sync: false }
      - { key: WEB_BASE_URL, sync: false }
      - { key: BOOTSTRAP_ADMIN_EMAIL, sync: false }
      - { key: PIPELINE_WEBHOOK_URL, sync: false }
      - { key: SENTRY_DSN, sync: false }
      - { key: SHOPIFY_SHOP, sync: false }
      - { key: SHOPIFY_ACCESS_TOKEN, sync: false }
      - { key: WOO_BASE_URL, sync: false }
      - { key: WOO_CONSUMER_KEY, sync: false }
      - { key: WOO_CONSUMER_SECRET, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ENDPOINT_URL, sync: false }
      - { key: S3_REGION, sync: false }
      - { key: AWS_ACCESS_KEY_ID, sync: false }
      - { key: AWS_SECRET_ACCESS_KEY, sync: false }
